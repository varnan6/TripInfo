# Server
server.port=8080

# Security: cap incoming request body size to prevent memory exhaustion
spring.servlet.multipart.max-request-size=10KB
spring.servlet.multipart.max-file-size=10KB

# Limit JSON request body size via Tomcat connector
server.tomcat.max-http-form-post-size=10KB

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# Application
app.data.file=trips.csv